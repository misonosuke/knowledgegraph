<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OAヘルプ業務 ナレッジグラフ可視化</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/vis-network.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/dist/vis-network.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:#060e1a;color:#e0e8f0;overflow:hidden}
.header{background:linear-gradient(90deg,#0a1628,#0d2040);padding:12px 24px;border-bottom:1px solid #1a3050;display:flex;align-items:center;gap:16px}
.header h1{font-size:15px;color:#a8d4f5;letter-spacing:0.5px}
.header p{font-size:11px;color:#4a7aaa;margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:8px 24px;background:#080f1e;border-bottom:1px solid #1a3050}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#6a9abc}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.toolbar{padding:7px 24px;background:#080f1e;display:flex;gap:8px;align-items:center;border-bottom:1px solid #1a3050;flex-wrap:wrap}
.toolbar label{color:#4a7aaa;font-size:12px}
select{background:#0d1f35;color:#a8d4f5;border:1px solid #1a3a5c;padding:4px 8px;border-radius:6px;font-size:12px;outline:none}
select:hover{border-color:#3d7aaa}
button{background:#0d1f35;color:#6a9abc;border:1px solid #1a3a5c;padding:4px 14px;border-radius:6px;cursor:pointer;font-size:12px;transition:all 0.15s}
button:hover{background:#1a3050;color:#a8d4f5;border-color:#3d7aaa}
#stat{color:#2a5a8a;font-size:11px;margin-left:8px}
#mynetwork{width:100%;height:calc(100vh - 120px);background:#060e1a}
#detail{position:fixed;bottom:20px;right:20px;width:280px;background:#0a1628;border:1px solid #1a3a5c;border-radius:10px;padding:14px 16px;font-size:12px;display:none;z-index:10}
#detail .dt{font-size:13px;font-weight:600;color:#a8d4f5;margin-bottom:4px}
#detail .badge{font-size:10px;padding:2px 8px;border-radius:20px;display:inline-block;margin-bottom:8px;font-weight:500}
#detail table{width:100%;border-collapse:collapse}
#detail td{padding:2px 0;vertical-align:top}
#detail td:first-child{color:#4a7aaa;width:38%;padding-right:8px}
#detail td:last-child{color:#c8dff0}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#4a7aaa;font-size:14px;z-index:100}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>OAヘルプ業務 ナレッジグラフ</h1>
    <p>ドラッグでビュー移動 / スクロールでズーム / ノードクリックで詳細表示</p>
  </div>
</div>

<div class="legend">
  <span class="li"><span class="dot" style="background:#1D9E75"></span>Entity（発話概念）</span>
  <span class="li"><span class="dot" style="background:#534AB7"></span>Intent（意図）</span>
  <span class="li"><span class="dot" style="background:#185FA5"></span>Operation（実行単位）</span>
  <span class="li"><span class="dot" style="background:#BA7517"></span>Condition（条件）</span>
  <span class="li"><span class="dot" style="background:#EF9F27"></span>Procedure（手順）</span>
  <span class="li"><span class="dot" style="background:#D85A30"></span>EscalationReason（引継理由）</span>
  <span style="margin-left:8px;font-size:11px;color:#2a5a8a">
    — triggers &nbsp;
    <span style="color:#534AB7">— routes_to</span> &nbsp;
    <span style="color:#185FA5">— requires</span> &nbsp;
    <span style="color:#BA7517">— proceeds_when</span> &nbsp;
    <span style="color:#EF9F27">— follows</span> &nbsp;
    <span style="color:#D85A30">— escalates_when</span> &nbsp;
    <span style="color:#888">-- answered_by</span>
  </span>
</div>

<div class="toolbar">
  <label>絞り込み:</label>
  <select id="filterSel" onchange="applyFilter()">
    <option value="all">全ノード</option>
    <option value="Entity">Entity</option>
    <option value="Intent">Intent</option>
    <option value="Operation">Operation</option>
    <option value="Condition">Condition</option>
    <option value="Procedure">Procedure</option>
    <option value="EscalationReason">EscalationReason</option>
  </select>
  <button onclick="network.fit({animation:{duration:400,easingFunction:'easeInOutQuad'}})">全体表示</button>
  <button id="physBtn" onclick="togglePhysics()">物理演算 ON</button>
  <span id="stat">20 ノード / 20 エッジ</span>
</div>

<div id="loading">グラフを描画中...</div>
<div id="mynetwork"></div>
<div id="detail"></div>

<script>
const C = {
  Entity:"#1D9E75", Intent:"#534AB7", Operation:"#185FA5",
  Condition:"#BA7517", Procedure:"#EF9F27", EscalationReason:"#D85A30"
};
const EC = {
  triggers:"#1D9E75", routes_to:"#534AB7", requires:"#185FA5",
  proceeds_when:"#BA7517", follows:"#EF9F27", escalates_when:"#D85A30", answered_by:"#888780"
};

function nodeStyle(type, label) {
  const c = C[type];
  const shape = type === "Operation" ? "box" : type === "Condition" ? "diamond" : "ellipse";
  return {
    shape, label,
    color: { background: c + "33", border: c, highlight: { background: c + "66", border: c } },
    font: { color: "#e0e8f0", size: 11, face: "Meiryo,sans-serif" },
    borderWidth: 1.5,
    size: type === "Operation" ? 28 : type === "Intent" ? 24 : 20
  };
}

const ALL_NODES = [
  { id:"e_password",   type:"Entity",           label:"パスワード",          synonyms:["PW","パスワ","passward","pass"], language:"ja" },
  { id:"e_login",      type:"Entity",           label:"ログイン・認証",       synonyms:["ログイン","サインイン","認証","login"], language:"ja" },
  { id:"e_error",      type:"Entity",           label:"エラー・不具合",       synonyms:["エラー","不具合","動かない","おかしい"], language:"ja" },
  { id:"e_howto",      type:"Entity",           label:"使い方・機能",         synonyms:["使い方","操作方法","機能","やり方"], language:"ja" },
  { id:"i_pw_reset",   type:"Intent",           label:"PW_RESET_INTENT",     description:"パスワードをリセットしたい", confidence_min:0.8, is_fallback:false },
  { id:"i_inquiry",    type:"Intent",           label:"INQUIRY_INTENT",      description:"OA操作・機能について知りたい", confidence_min:0.75, is_fallback:false },
  { id:"i_unknown",    type:"Intent",           label:"UNKNOWN_INTENT",      description:"いずれのIntentにも該当しない", confidence_min:null, is_fallback:true },
  { id:"op_pw_reset",  type:"Operation",        label:"PASSWORD_RESET_OP",   op_type:"deterministic", is_active:true },
  { id:"op_inquiry",   type:"Operation",        label:"KNOWLEDGE\nINQUIRY_OP", op_type:"generative", is_active:true },
  { id:"op_handoff",   type:"Operation",        label:"HUMAN\nHANDOFF_OP",   op_type:"deterministic", is_active:true },
  { id:"c_identity",   type:"Condition",        label:"本人確認条件",         condition_type:"binary", rule:"identity_match" },
  { id:"c_confidence", type:"Condition",        label:"確信度条件",           condition_type:"threshold", metric:"rag_score", threshold:0.75 },
  { id:"p_identity",   type:"Procedure",        label:"本人確認手順",         exec_type:"rule_based", content:"社員番号と氏名の一致を確認する" },
  { id:"p_pw_send",    type:"Procedure",        label:"PW送信手順",           exec_type:"api_call", content:"SMSでリセットURLを送信する" },
  { id:"p_faq",        type:"Procedure",        label:"FAQ検索手順",          exec_type:"rag", content:"RAGで関連FAQ・手順を検索する" },
  { id:"p_answer",     type:"Procedure",        label:"回答生成手順",         exec_type:"rag", content:"LLMが回答テキストを生成する" },
  { id:"esc_identity", type:"EscalationReason", label:"本人確認失敗",         reason_type:"rule_violation", occurrence_count:0 },
  { id:"esc_conf",     type:"EscalationReason", label:"低確信度",             reason_type:"low_confidence", occurrence_count:0 },
  { id:"esc_scope",    type:"EscalationReason", label:"スコープ外",           reason_type:"out_of_scope", occurrence_count:0 },
  { id:"esc_user",     type:"EscalationReason", label:"ユーザー要求",         reason_type:"user_request", occurrence_count:0 }
];

const ALL_EDGES = [
  { from:"e_password",   to:"i_pw_reset",   label:"triggers",      rel:"triggers" },
  { from:"e_password",   to:"i_inquiry",    label:"triggers",      rel:"triggers" },
  { from:"e_login",      to:"i_pw_reset",   label:"triggers",      rel:"triggers" },
  { from:"e_login",      to:"i_inquiry",    label:"triggers",      rel:"triggers" },
  { from:"e_error",      to:"i_inquiry",    label:"triggers",      rel:"triggers" },
  { from:"e_howto",      to:"i_inquiry",    label:"triggers",      rel:"triggers" },
  { from:"i_pw_reset",   to:"op_pw_reset",  label:"routes_to",     rel:"routes_to" },
  { from:"i_inquiry",    to:"op_inquiry",   label:"routes_to",     rel:"routes_to" },
  { from:"i_unknown",    to:"op_handoff",   label:"routes_to",     rel:"routes_to" },
  { from:"i_inquiry",    to:"p_faq",        label:"answered_by",   rel:"answered_by" },
  { from:"op_pw_reset",  to:"c_identity",   label:"requires",      rel:"requires" },
  { from:"op_inquiry",   to:"c_confidence", label:"requires",      rel:"requires" },
  { from:"c_identity",   to:"p_identity",   label:"proceeds_when", rel:"proceeds_when" },
  { from:"c_confidence", to:"p_faq",        label:"proceeds_when", rel:"proceeds_when" },
  { from:"p_identity",   to:"p_pw_send",    label:"follows",       rel:"follows" },
  { from:"p_faq",        to:"p_answer",     label:"follows",       rel:"follows" },
  { from:"c_identity",   to:"esc_identity", label:"escalates_when",rel:"escalates_when" },
  { from:"c_confidence", to:"esc_conf",     label:"escalates_when",rel:"escalates_when" },
  { from:"op_handoff",   to:"esc_scope",    label:"requires",      rel:"requires" },
  { from:"op_handoff",   to:"esc_user",     label:"requires",      rel:"requires" }
];

const visNodes = new vis.DataSet(ALL_NODES.map((n,i) => ({
  id: n.id, ...nodeStyle(n.type, n.label), title: n.type, _type: n.type
})));

const visEdges = new vis.DataSet(ALL_EDGES.map((e,i) => ({
  id: i, from: e.from, to: e.to,
  label: e.label,
  color: { color: EC[e.rel] + "bb", highlight: EC[e.rel] },
  font: { color: EC[e.rel], size: 9, align: "middle", strokeWidth: 0 },
  arrows: { to: { enabled: true, scaleFactor: 0.6 } },
  smooth: { type: "dynamic", roundness: 0.3 },
  dashes: e.rel === "answered_by",
  width: 1.2,
  _rel: e.rel
})));

const container = document.getElementById("mynetwork");
const network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, {
  layout: { improvedLayout: true, randomSeed: 42 },
  physics: {
    enabled: true,
    stabilization: { iterations: 400, fit: true },
    barnesHut: { gravitationalConstant: -9000, centralGravity: 0.2, springLength: 130, springConstant: 0.03, damping: 0.15 }
  },
  interaction: {
    hover: true, tooltipDelay: 100,
    navigationButtons: true, keyboard: true, zoomView: true,
    dragView: true
  },
  nodes: { borderWidth: 1.5 },
});

network.once("stabilizationIterationsDone", () => {
  document.getElementById("loading").style.display = "none";
  network.setOptions({ physics: { enabled: false } });
  network.fit({ animation: { duration: 600, easingFunction: "easeInOutQuad" } });
});

network.on("click", params => {
  if (params.nodes.length === 0) { document.getElementById("detail").style.display = "none"; return; }
  const id = params.nodes[0];
  const nd = ALL_NODES.find(n => n.id === id);
  if (!nd) return;
  const color = C[nd.type];
  const skip = new Set(["id","type","label"]);
  const rows = Object.entries(nd).filter(([k]) => !skip.has(k)).map(([k,v]) =>
    `<tr><td>${k}</td><td>${Array.isArray(v)?v.join(", "):v===null?"null":String(v)}</td></tr>`
  ).join("");
  document.getElementById("detail").style.display = "block";
  document.getElementById("detail").innerHTML = `
    <div class="dt">${nd.label}</div>
    <span class="badge" style="background:${color}33;color:${color}">${nd.type}</span>
    <table>${rows}</table>
  `;
});

let physOn = false;
function togglePhysics() {
  physOn = !physOn;
  network.setOptions({ physics: { enabled: physOn } });
  document.getElementById("physBtn").textContent = "物理演算 " + (physOn ? "OFF" : "ON");
}

function applyFilter() {
  const f = document.getElementById("filterSel").value;
  const show = new Set();
  ALL_NODES.forEach(n => { if (f === "all" || n.type === f) show.add(n.id); });
  // 関連ノードも表示
  ALL_EDGES.forEach(e => { if (show.has(e.from) || show.has(e.to)) { show.add(e.from); show.add(e.to); } });
  visNodes.forEach(n => visNodes.update({ id: n.id, hidden: !show.has(n.id) }));
  visEdges.forEach(e => visEdges.update({ id: e.id, hidden: !(show.has(e.from) && show.has(e.to)) }));
  document.getElementById("stat").textContent = show.size + " ノード表示";
  network.fit({ animation: true });
}
</script>
</body>
</html>
